# ESP32-WROOM-32: local wake word, then Home Assistant Assist (no audio output).
substitutions:
  name: esphome-web-619b9c
  friendly_name: ESP32 Microphone
  wake_word_model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
  wake_word_probability_cutoff: "0.69"
  microphone_gain: "1"
  microphone_channel: left
  microphone_sck_pin: GPIO26
  microphone_ws_pin: GPIO25
  microphone_sd_pin: GPIO33

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  name_add_mac_suffix: false
  on_boot:
    priority: -100
    then:
      - script.execute: start_wake_detection

globals:
  - id: assist_requested
    type: bool
    restore_value: false
    initial_value: "false"
  - id: assist_started_at
    type: uint32_t
    restore_value: false
    initial_value: "0"

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: DEBUG
  baud_rate: 115200

api:
  on_client_connected:
    - script.execute: start_wake_detection

ota:
  - platform: esphome

wifi:
  power_save_mode: none

# INMP441: VDD=3V3, GND=GND, L/R=GND (left channel).
i2s_audio:
  - id: microphone_bus
    i2s_bclk_pin: ${microphone_sck_pin}
    i2s_lrclk_pin: ${microphone_ws_pin}

microphone:
  - platform: i2s_audio
    id: inmp441_microphone
    i2s_audio_id: microphone_bus
    adc_type: external
    i2s_din_pin: ${microphone_sd_pin}
    pdm: false
    channel: ${microphone_channel}
    sample_rate: 16000
    bits_per_sample: 32bit
    correct_dc_offset: true
    on_data:
      - lambda: |-
          static uint32_t last_log = 0;
          static uint32_t samples = 0;
          static uint32_t peak = 0;
          static uint64_t magnitude_sum = 0;
          const uint32_t now = millis();
          if (last_log == 0) last_log = now;
          for (size_t offset = 0; offset + sizeof(int32_t) <= x.size(); offset += sizeof(int32_t)) {
            int32_t raw;
            memcpy(&raw, x.data() + offset, sizeof(raw));
            const int32_t sample = raw / 65536;
            const uint32_t magnitude = sample < 0 ? -sample : sample;
            if (magnitude > peak) peak = magnitude;
            magnitude_sum += magnitude;
            samples++;
          }
          const uint32_t elapsed = now - last_log;
          if (elapsed >= 5000) {
            ESP_LOGI("mic_audio", "samples_per_s=%u peak16=%u mean_abs16=%u",
                static_cast<unsigned>(static_cast<uint64_t>(samples) * 1000 / elapsed),
                static_cast<unsigned>(peak),
                static_cast<unsigned>(samples ? magnitude_sum / samples : 0));
            samples = 0;
            peak = 0;
            magnitude_sum = 0;
            last_log = now;
          }

micro_wake_word:
  id: wake_detector
  microphone:
    microphone: inmp441_microphone
    channels: 0
    gain_factor: ${microphone_gain}
  stop_after_detection: true
  models:
    - model: ${wake_word_model}
      id: selected_wake_word
      probability_cutoff: ${wake_word_probability_cutoff}
  on_wake_word_detected:
    - lambda: |-
        ESP_LOGI("wake_word", "1");
    - if:
        condition:
          and:
            - voice_assistant.connected:
                id: assist
            - lambda: return !id(assist_requested) && !id(assist).is_running();
        then:
          - lambda: |-
              id(assist_requested) = true;
              id(assist_started_at) = 0;
          - script.execute:
              id: start_assist
              detected_word: !lambda return wake_word;
        else:
          - logger.log:
              level: WARN
              tag: wroom_assist
              format: "Assist is unavailable or already busy; returning to wake-word detection"
          - script.execute: resume_wake_detection

voice_assistant:
  id: assist
  microphone:
    microphone: inmp441_microphone
    channels: 0
    gain_factor: ${microphone_gain}
  micro_wake_word: wake_detector
  use_wake_word: false
  on_client_connected:
    - logger.log:
        level: INFO
        tag: wroom_assist
        format: "Home Assistant Assist connected"
    - script.execute: start_wake_detection
  on_client_disconnected:
    - logger.log:
        level: WARN
        tag: wroom_assist
        format: "Home Assistant Assist disconnected"
    - voice_assistant.stop:
        id: assist
    - script.execute: resume_wake_detection
  on_start:
    - logger.log:
        level: INFO
        tag: wroom_assist
        format: "Assist request started"
  on_listening:
    - logger.log:
        level: INFO
        tag: wroom_assist
        format: "Listening for command"
  on_stt_end:
    - lambda: |-
        ESP_LOGI("wroom_assist", "Recognized command: %s", x.c_str());
  on_intent_end:
    - logger.log:
        level: INFO
        tag: wroom_assist
        format: "Home Assistant finished processing the intent"
  on_tts_start:
    - lambda: |-
        ESP_LOGI("wroom_assist", "Response text: %s", x.c_str());
  on_end:
    - logger.log:
        level: INFO
        tag: wroom_assist
        format: "Assist request ended"
    - script.execute: resume_wake_detection
  on_error:
    - lambda: |-
        ESP_LOGW("wroom_assist", "Assist error [%s]: %s", code.c_str(), message.c_str());
    - voice_assistant.stop:
        id: assist
    - script.execute: resume_wake_detection

script:
  - id: start_wake_detection
    mode: single
    then:
      - wait_until:
          condition:
            lambda: return id(wake_detector).is_ready();
          timeout: 15s
      - if:
          condition:
            lambda: return !id(assist_requested) && !id(assist).is_running() && id(wake_detector).is_ready() && !id(wake_detector).is_failed() && !id(wake_detector).is_running();
          then:
            - micro_wake_word.enable_model: selected_wake_word
            - logger.log:
                level: INFO
                tag: wroom_status
                format: "Requesting wake-word detection start"
            - micro_wake_word.start:
                id: wake_detector


  - id: start_assist
    mode: single
    parameters:
      detected_word: string
    then:
      - micro_wake_word.stop:
          id: wake_detector
      - wait_until:
          condition:
            lambda: return !id(wake_detector).is_running() && id(inmp441_microphone).is_stopped();
          timeout: 5s
      - if:
          condition:
            and:
              - voice_assistant.connected:
                  id: assist
              - lambda: return id(assist_requested) && !id(assist).is_running() && !id(wake_detector).is_running() && id(inmp441_microphone).is_stopped();
          then:
            - lambda: id(assist_started_at) = millis();
            - voice_assistant.start:
                id: assist
                wake_word: !lambda return detected_word;
          else:
            - logger.log:
                level: WARN
                tag: wroom_assist
                format: "Could not hand microphone to Assist"
            - script.execute: resume_wake_detection

  - id: resume_wake_detection
    mode: restart
    then:
      - delay: 250ms
      - wait_until:
          condition:
            lambda: return !id(assist).is_running() && !id(wake_detector).is_running();
          timeout: 15s
      - if:
          condition:
            lambda: return !id(assist).is_running() && !id(wake_detector).is_running();
          then:
            - lambda: |-
                id(assist_requested) = false;
                id(assist_started_at) = 0;
            - script.execute: start_wake_detection


interval:
  - interval: 10s
    then:
      - lambda: |-
          ESP_LOGI("wroom_status", "detector_running=%d microphone_running=%d detector_failed=%d assist_running=%d assist_requested=%d",
              id(wake_detector).is_running(), id(inmp441_microphone).is_running(),
              id(wake_detector).is_failed(), id(assist).is_running(), id(assist_requested));
          if (id(assist_requested) && id(assist_started_at) != 0 &&
              millis() - id(assist_started_at) > 60000) {
            ESP_LOGW("wroom_assist", "Assist request timed out after 60 seconds");
            id(assist_started_at) = 0;
            id(assist).request_stop();
            id(resume_wake_detection).execute();
          }

button:
  - platform: template
    name: "Start wake detection"
    entity_category: diagnostic
    on_press:
      - script.execute: start_wake_detection
