blueprint:
  name: Voice PE — озвучить и показать на часах
  description: >-
    Озвучить текст голосом Assist выбранной колонки и показать текст или картинку
    на её матрице MAX7219. Картинка выбирается в выпадающем списке сценария.
    При заполнении текста экрана и картинки показывается картинка.
    После заданного времени матрица возвращается к часам/таймеру.
    Требуется действие matrix_show с параметром start_delay.
  domain: script
  input:
    satellite:
      name: Колонка для озвучки
      description: Assist Satellite вашей Voice PE. Речь синтезируется её выбранным Assist-пайплайном.
      selector:
        entity:
          filter:
            - domain: assist_satellite
    matrix_action:
      name: Действие матрицы этой же колонки
      description: >-
        Полное имя действия matrix_show той же Voice PE, например
        esphome.home_assistant_voice_0ab77d_matrix_show.
        Для другой колонки создайте отдельный сценарий.
      selector:
        text:
mode: queued
max: 10
variables:
  voice_satellite: !input satellite
fields:
  speech:
    name: Текст озвучки
    description: Текст, который произнесёт выбранная колонка.
    required: true
    selector:
      text:
        multiline: true
  message:
    name: Текст на часах
    description: Необязательно. Длинный текст прокручивается; картинка имеет приоритет.
    required: false
    default: ""
    selector:
      text:
  icon:
    name: Картинка на часах
    required: false
    default: none
    selector:
      select:
        mode: dropdown
        options:
          - label: Без картинки
            value: none
          - label: Улыбка
            value: smile
          - label: Грусть
            value: sad
          - label: Сердце
            value: heart
          - label: Галочка
            value: check
          - label: Крестик
            value: cross
          - label: Колокольчик
            value: bell
  duration:
    name: Время показа на часах
    description: Секунды с начала показа, от 1 до 3600. Не определяет длительность речи.
    required: false
    default: 10
    selector:
      number:
        min: 1
        max: 3600
        step: 1
        mode: box
        unit_of_measurement: s
  start_delay:
    name: Задержка перед озвучкой и показом
    required: false
    default: 0
    selector:
      number:
        min: 0
        max: 3600
        step: 1
        mode: box
        unit_of_measurement: s
sequence:
  - variables:
      spoken_text: "{{ speech | default('', true) | string | trim }}"
      display_text: "{{ message | default('', true) | string | trim }}"
      display_icon: "{{ icon | default('none', true) | string | trim | lower }}"
      display_duration: "{{ duration | default(10) | int(10) }}"
      announcement_delay: "{{ start_delay | default(0, true) | int(0) }}"
  - if:
      - condition: template
        value_template: "{{ not spoken_text }}"
    then:
      - stop: Укажите текст озвучки.
        error: true
  - if:
      - condition: template
        value_template: "{{ display_icon not in ['none', 'smile', 'sad', 'heart', 'check', 'cross', 'bell'] }}"
    then:
      - stop: Выберите картинку из списка.
        error: true
  - if:
      - condition: template
        value_template: "{{ display_duration < 1 or display_duration > 3600 or announcement_delay < 0 or announcement_delay > 3600 }}"
    then:
      - stop: Время показа должно быть от 1 до 3600 секунд, задержка — от 0 до 3600.
        error: true
  - delay:
      seconds: "{{ announcement_delay }}"
  - if:
      - condition: template
        value_template: "{{ (display_text | length > 0) or display_icon != 'none' }}"
    then:
      - action: !input matrix_action
        data:
          message: "{{ display_text }}"
          icon: "{{ display_icon }}"
          duration: "{{ display_duration }}"
          start_delay: 0
  - action: assist_satellite.announce
    target:
      entity_id: "{{ voice_satellite }}"
    data:
      message: "{{ spoken_text }}"
