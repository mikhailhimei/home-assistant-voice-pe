blueprint:
  name: Voice PE — управление экраном часов
  description: >-
    Показать текст или картинку на матрице MAX7219, затем вернуть часы/таймер.
    Картинка выбирается в выпадающем списке сценария и имеет приоритет над текстом.
    Пустые текст и картинка либо длительность 0 возвращают часы.
    Требуется действие matrix_show с параметром start_delay.
  domain: script
  input:
    matrix_action:
      name: Действие матрицы колонки
      description: >-
        Полное имя действия matrix_show нужной Voice PE, например
        esphome.home_assistant_voice_0ab77d_matrix_show.
        Для другой колонки создайте отдельный сценарий.
      selector:
        text:
mode: parallel
max: 10
fields:
  message:
    name: Текст на часах
    description: Необязательно. Длинный текст прокручивается; картинка имеет приоритет.
    required: false
    default: ""
    selector:
      text:
  icon:
    name: Картинка на часах
    required: false
    default: none
    selector:
      select:
        mode: dropdown
        options:
          - label: Без картинки
            value: none
          - label: Улыбка
            value: smile
          - label: Грусть
            value: sad
          - label: Сердце
            value: heart
          - label: Галочка
            value: check
          - label: Крестик
            value: cross
          - label: Колокольчик
            value: bell
  duration:
    name: Время показа на часах
    description: Секунды с начала показа, от 0 до 3600; 0 — вернуть часы.
    required: false
    default: 10
    selector:
      number:
        min: 0
        max: 3600
        step: 1
        mode: box
        unit_of_measurement: s
  start_delay:
    name: Задержка перед показом
    required: false
    default: 0
    selector:
      number:
        min: 0
        max: 3600
        step: 1
        mode: box
        unit_of_measurement: s
sequence:
  - variables:
      display_text: "{{ message | default('', true) | string | trim }}"
      display_icon: "{{ icon | default('none', true) | string | trim | lower }}"
      display_duration: "{{ duration | default(10) | int(10) }}"
      display_delay: "{{ start_delay | default(0) | int(0) }}"
  - if:
      - condition: template
        value_template: "{{ display_icon not in ['none', 'smile', 'sad', 'heart', 'check', 'cross', 'bell'] }}"
    then:
      - stop: Выберите картинку из списка.
        error: true
  - if:
      - condition: template
        value_template: "{{ display_duration < 0 or display_duration > 3600 or display_delay < 0 or display_delay > 3600 }}"
    then:
      - stop: Время показа и задержка должны быть от 0 до 3600 секунд.
        error: true
  - action: !input matrix_action
    data:
      message: "{{ display_text }}"
      icon: "{{ display_icon }}"
      duration: "{{ display_duration }}"
      start_delay: "{{ display_delay }}"
